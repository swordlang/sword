# The suite on both systems the runtime is written for, with TLS and without,
# and then the suite again at every pool size from 1 to 16 threads. The second
# half is the one that matters most: a program's answer is not supposed to
# depend on how many threads ran it, and tests/threads.sh is where that is
# checked rather than claimed. Nor on the machine: Linux arm64 runs the suite
# too, and the answers of the three are compared.
#
# Then the runtime again under AddressSanitizer and ThreadSanitizer, since most
# of what can go wrong in it passes an ordinary run, the suite once more built
# with --split, and every example program in the documentation, which a reader
# will paste and expect to build.
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the run for the previous one worthless.
# Runs on main and develop are kept whole: each is the record for its commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tls: [with, without]
        include:
          - os: ubuntu-24.04-arm
            tls: with
    name: ${{ matrix.os }}, ${{ matrix.tls }} TLS
    runs-on: ${{ matrix.os }}
    # A normal run takes under ten minutes. A hang takes whatever it is
    # allowed, and the default is six hours.
    timeout-minutes: 30
    env:
      SWORD_NO_TLS: ${{ matrix.tls == 'without' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The packages themselves, kept between runs. Emacs alone is 54 MB from the
      # universe pocket, which the Azure mirror has served at 23 kB/s: a job spent
      # 26 of its 30 minutes downloading it. The cache comes from GitHub instead,
      # and a run saves what it fetched for the next one.
      - name: Cache of downloaded packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

      # clang is needed to run the compiler, not only to build it. Emacs is here
      # so the indentation check has both of the editors that implement the rule.
      # Without --no-install-recommends Emacs brings a mail server and Guile along.
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          mkdir -p ~/apt-archives/partial
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            clang libssl-dev vim emacs-nox
          sudo chown -R "$USER" ~/apt-archives

      - run: make
      - run: make test
      - name: The suite at 1, 2, 3, 4, 8 and 16 threads
        env:
          SWORD_ANSWERS: ${{ matrix.tls == 'with' && format('{0}/answers.txt', runner.temp) || '' }}
        run: ./tests/threads.sh
      - if: matrix.tls == 'with'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: answers-${{ matrix.os }}
          path: ${{ runner.temp }}/answers.txt

  # A det program answers the same bits on every machine, so every test that
  # prints something must print the same thing on x86-64 and on arm64, on Linux
  # and on macOS.
  answers:
    name: same answers on every machine
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: answers-*
      - run: |
          set -- answers-*/answers.txt
          [ $# -eq 3 ] || { echo "want three machines' answers, have $#"; exit 1; }
          bad=0
          for other in "$2" "$3"; do
            if ! diff "$1" "$other" > diff.txt; then
              echo "$1 and $other differ:"
              cat diff.txt
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "$(wc -l < "$1") tests, the same answers on all three"
          exit "$bad"

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [address, thread]
    name: ${{ matrix.os }}, ${{ matrix.sanitizer }} sanitizer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libssl-dev

      # ThreadSanitizer reserves fixed ranges of the address space, and the
      # runners randomise mappings more widely than the version of it that
      # clang ships can work around.
      - name: Address space ThreadSanitizer can use
        if: runner.os == 'Linux' && matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - run: make
      - run: ./tests/sanitize.sh ${{ matrix.sanitizer }}

  # The same programs built one object per package. Nothing else builds that
  # way, so without this a mistake in it would wait for somebody to ask for it.
  split:
    name: split build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libssl-dev
      - run: make
      - run: SWORD_SPLIT=1 SWORD_CACHE="$RUNNER_TEMP/sword-cache" ./tests/run.sh

  docs:
    name: documentation examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libssl-dev
      - run: make
      - run: ./tests/docs.sh
